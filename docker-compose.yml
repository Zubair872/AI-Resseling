services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orbitly
      POSTGRES_USER: orbitly
      POSTGRES_PASSWORD: orbitly
    ports:
      - "5432:5432"
    volumes:
      - orbitly-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  orbitly-postgres:
